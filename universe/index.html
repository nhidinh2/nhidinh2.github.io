<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explore Nhi's interactive Roblox-style portfolio town.">
  <title>Nhi's Universe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23000' width='32' height='32' rx='9'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='19' font-family='Arial' font-weight='bold' fill='white'%3Eni%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261016-chat">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Nhi's interactive portfolio town. WASD to move, Space to jump, E to interact, arrow keys to turn the camera, Escape to close panels."></canvas>

  <div class="hud-tl">
    <a class="btn plain home" href="../">← Back to Profile</a>
    <span class="pill"><span class="coin-ico" aria-hidden="true"></span><span id="coinCount">0 NhiCoins</span></span>
  </div>
  <div class="hud-tr">
    <button class="btn blue" id="badgeBtn" type="button">Badges 0/9</button>
    <button class="btn plain sound" id="soundBtn" type="button">Sound on</button>
  </div>
  <div class="location pill" id="locationName" aria-live="polite">Achievement Plaza</div>
  <div class="pill hint" id="hint">WASD move · Arrow keys turn the camera · Space jump · E interact · Scroll to zoom · Click things!</div>
  <button class="interact" id="interactPrompt" type="button" hidden><kbd>E</kbd><span id="interactText">Interact</span></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="say-bubble" id="guideBubble" role="status" aria-live="polite" hidden></div>
  <div class="badge-pop" id="badgePop" role="status" aria-live="polite"></div>

  <div class="touch" id="joy" aria-hidden="true"><div id="knob"></div></div>
  <button class="touch btn go" id="jumpBtn" type="button" aria-label="Jump">JUMP</button>

  <div class="overlay" id="start">
    <button class="btn go big" id="playBtn" type="button" disabled>PLAY</button>
  </div>
  <div class="overlay" id="panel" hidden></div>

  <noscript><p class="noscript">Nhi's Universe needs JavaScript. <a href="../">Visit the profile instead.</a></p></noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../js/content.js?v=20261025-random-pdf"></script>
  <script src="js/kit.js?v=20261016-tuxedo"></script>
  <script src="js/world.js?v=20261016-tuxedo"></script>
  <script src="js/chat.js?v=20261016-conversational"></script>
  <script src="js/game.js?v=20261016-no-quick-questions"></script>
</body>
</html>
